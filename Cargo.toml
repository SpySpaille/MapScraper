[package]
name = "mapscraper"
version = "1.8.1"
authors = ["SpySpaille"]
edition = "2021"
description = "High-performance Source Engine content scraper for VMF maps"

[lib]
name = "mapscraper"
path = "src/lib.rs"

[[bin]]
name = "MapScraper"
path = "src/main.rs"

[dependencies]
colored = "2.1"
dirs = "5.0"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["native-tls"] }
vpk = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"     # Optimize for smallest size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Maximize LTO optimization
panic = "abort"     # Remove panic unwinding tables
strip = true        # Strip symbols and debug info
